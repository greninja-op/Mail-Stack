[package]
name = "mailstack-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mailstack Windows desktop app — egui interim shell; WinUI3/WinAppSDK packaging path"
publish = false

[lib]
name = "mailstack_windows"
path = "src/lib.rs"

[[bin]]
name = "Mailstack"
path = "src/main.rs"

[dependencies]
desktop-core = { workspace = true }
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde = { workspace = true, features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[dev-dependencies]
desktop-core = { workspace = true }
