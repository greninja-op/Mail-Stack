name: platform-tests

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  linux-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: shared jvmTest
        working-directory: shared
        run: |
          chmod +x gradlew || true
          if [[ -x ./gradlew ]]; then ./gradlew jvmTest --no-daemon; else gradle jvmTest --no-daemon; fi

      - name: AndroidTablet unit tests
        working-directory: AndroidTablet
        run: |
          chmod +x gradlew || true
          if [[ -x ./gradlew ]]; then ./gradlew :app:testDebugUnitTest --no-daemon; else gradle :app:testDebugUnitTest --no-daemon; fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test workspace (desktop-core, Windows, Linux)
        run: cargo test --workspace

      - name: Windows CLI smoke
        run: cargo run --manifest-path Windows/Cargo.toml

      - name: Linux CLI smoke
        run: cargo run --manifest-path Linux/Cargo.toml

      - name: Static checks (scaffolds)
        run: |
          set -euo pipefail
          pip install pyyaml --quiet
          echo "== YAML project.yml present =="
          test -f iOS/project.yml && test -f iPadOS/project.yml && test -f macOS/project.yml
          python3 - <<'PY'
          import yaml, pathlib
          for p in ["iOS/project.yml", "iPadOS/project.yml", "macOS/project.yml"]:
              yaml.safe_load(pathlib.Path(p).read_text())
              print("OK parse", p)
          PY
          echo "== no travelling-pulse implementation =="
          # Allow docs/CONTEXT mentions; fail only on source implementing pulse animation.
          if git grep -riE 'travelling.?pulse|traveling.?pulse|pulse travels|ImportArc' -- \
              'iOS/Mailstack' 'iPadOS/MailstackPad' 'AndroidTablet/app' 'macOS/MailstackMac' \
              'Windows/src' 'Linux/src' 'shared/src' 'desktop-core/src'; then
            echo "unexpected pulse implementation"; exit 1
          fi
          echo "OK"
          echo "== no secret-looking strings =="
          if git grep -EIi 'client_secret|BEGIN (RSA |OPENSSH )?PRIVATE KEY|AIza[0-9A-Za-z_-]{20}' -- \
              iOS iPadOS AndroidTablet macOS Windows Linux shared desktop-core .github; then
            echo "secret-like string found"; exit 1
          fi
          echo "OK no secrets"

  # Swift / XCTest — requires a macOS runner. Do not fake green on Linux.
  apple-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate + test iOS
        working-directory: iOS
        run: |
          xcodegen generate
          xcodebuild test -scheme Mailstack -destination 'platform=iOS Simulator,name=iPhone 16' -quiet
      - name: Generate + test iPadOS
        working-directory: iPadOS
        run: |
          xcodegen generate
          xcodebuild test -scheme MailstackPad -destination 'platform=iOS Simulator,name=iPad (10th generation)' -quiet || \
          xcodebuild test -scheme MailstackPad -destination 'platform=iOS Simulator,name=iPad Air 11-inch (M2)' -quiet
      - name: Generate macOS project (compile if scheme allows)
        working-directory: macOS
        run: |
          xcodegen generate
          # Full UI test blocked until UniFFI + signing; at least generate the project.
          test -d MailstackMac.xcodeproj
