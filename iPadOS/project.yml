name: MailstackPad
options:
  bundleIdPrefix: com.greninjaop
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  MailstackPad:
    type: application
    platform: iOS
    sources: [MailstackPad]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greninjaop.mailorganizer.ipad
        INFOPLIST_FILE: MailstackPad/Info.plist
        GENERATE_INFOPLIST_FILE: false
  MailstackPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MailstackPadTests]
    dependencies: [{ target: MailstackPad }]
