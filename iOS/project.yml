# XcodeGen spec — run on macOS: `xcodegen generate`
# Linux Cloud Agent cannot run xcodebuild; this file is the project source of truth.
name: Mailstack
options:
  bundleIdPrefix: com.greninjaop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    INFOPLIST_FILE: Mailstack/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.greninjaop.mailorganizer
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mailstack:
    type: application
    platform: iOS
    sources:
      - path: Mailstack
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_NAME: Mailstack
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Mailstack/Info.plist
      properties:
        CFBundleDisplayName: Mailstack
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.greninjaop.mailorganizer
            CFBundleURLSchemes:
              - com.greninjaop.mailorganizer
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
  MailstackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MailstackTests
    dependencies:
      - target: Mailstack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.greninjaop.mailorganizer.tests
schemes:
  Mailstack:
    build:
      targets:
        Mailstack: all
        MailstackTests: [test]
    test:
      targets:
        - MailstackTests
